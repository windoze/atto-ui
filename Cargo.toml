[package]
name = "atto-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
crossterm = "0.29.0"
once_cell = "1.21.3"
parking_lot = "0.12.5"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"
atto-ui-macros = { path = "crates/atto-ui-macros" }

[dev-dependencies]
atto-ui-test-host = { path = "crates/atto-ui-test-host" }

# Demo binaries (teaching materials under `demos/`)
[[bin]]
name = "demo-01-hello-world"
path = "demos/01-hello-world/main.rs"

[[bin]]
name = "demo-02-window-management"
path = "demos/02-window-management/main.rs"

[[bin]]
name = "demo-03-event-handling"
path = "demos/03-event-handling/main.rs"

[[bin]]
name = "demo-04-menu-creation"
path = "demos/04-menu-creation/main.rs"

[[bin]]
name = "demo-05-basic-controls"
path = "demos/05-basic-controls/main.rs"

[[bin]]
name = "demo-06-data-binding"
path = "demos/06-data-binding/main.rs"

[[bin]]
name = "demo-07-layout-management"
