[package]
name = "chatty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
chatty-test-host = { path = "crates/chatty-test-host" }

[workspace]
members = ["crates/chatty-test-host"]
