[package]
name = "atto-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
crossterm = "0.28"
editor-core = "0.1.0"
editor-core-highlight-simple = "0.1.0"
editor-core-lsp = "0.1.0"
editor-core-sublime = "0.1.0"
once_cell = "1"
parking_lot = "0.12"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-segmentation = "1"
unicode-width = "0.2"
pulldown-cmark = "0.10"

[dev-dependencies]
atto-ui-macros = { path = "crates/atto-ui-macros" }
atto-ui-test-host = { path = "crates/atto-ui-test-host" }

# Demo binaries (teaching materials under `demos/`)
[[bin]]
name = "demo-01-hello-world"
path = "demos/01-hello-world/main.rs"

[[bin]]
name = "demo-02-window-management"
path = "demos/02-window-management/main.rs"

[[bin]]
name = "demo-03-event-handling"
path = "demos/03-event-handling/main.rs"

[[bin]]
name = "demo-04-menu-creation"
path = "demos/04-menu-creation/main.rs"

[[bin]]
name = "demo-05-basic-controls"
path = "demos/05-basic-controls/main.rs"

[[bin]]
name = "demo-06-data-binding"
path = "demos/06-data-binding/main.rs"

[[bin]]
name = "demo-07-layout-management"
path = "demos/07-layout-management/main.rs"

[[bin]]
name = "demo-08-foreach-demo"
path = "demos/08-foreach-demo/main.rs"

[[bin]]
name = "demo-09-custom-components"
path = "demos/09-custom-components/main.rs"

[[bin]]
name = "demo-10-file-dialog"
path = "demos/10-file-dialog/main.rs"

[workspace]
members = ["crates/atto-ui-test-host", "crates/atto-ui-macros"]
