[package]
name = "atto-ui-async"
version = "0.1.0"
edition = "2024"

[dependencies]
atto-ui = { path = "../.." }
anyhow = { version = "1.0.101", optional = true }
crossterm = { version = "0.29.0", optional = true, features = ["event-stream"] }
futures-util = { version = "0.3.31", optional = true, default-features = false, features = ["std"] }
ratatui = { version = "0.30.0", optional = true }
tokio = { version = "1.48.0", optional = true, default-features = false, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
atto-ui-test-host = { path = "../atto-ui-test-host" }

[features]
default = []
tokio-runtime = ["dep:tokio"]
event-stream = [
    "tokio-runtime",
    "dep:anyhow",
    "dep:crossterm",
    "dep:futures-util",
    "dep:ratatui",
    "crossterm/event-stream",
]
full = ["event-stream"]

[[bin]]
name = "snapshot_tokio_app"
path = "src/bin/snapshot_tokio_app.rs"
required-features = ["event-stream"]
