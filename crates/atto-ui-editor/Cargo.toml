[package]
name = "atto-ui-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
atto-ui = { path = "../.." }
atto-ui-chat = { path = "../atto-ui-chat" }
crossterm = "0.29.0"
editor-core = "0.5.0"
editor-core-highlight-simple = "0.5.0"
editor-core-lsp = "0.5.0"
editor-core-sublime = "0.5.0"
editor-core-treesitter = "0.5.0"
editor-core-diff = "0.5.0"
editor-core-diff-view = "0.5.0"
ratatui = "0.30.0"
regex = "1.12.2"
serde_json = "1.0.149"
tree-sitter = "0.26"
unicode-width = "0.2.2"

[dev-dependencies]
atto-ui-test-host = { path = "../atto-ui-test-host" }

[[bin]]
name = "snapshot_diff_app"
path = "src/bin/snapshot_diff_app.rs"
test = false

[[bin]]
name = "snapshot_editor_app"
path = "src/bin/snapshot_editor_app.rs"
test = false

[[bin]]
name = "snapshot_rich_artifact_app"
path = "src/bin/snapshot_rich_artifact_app.rs"
test = false
